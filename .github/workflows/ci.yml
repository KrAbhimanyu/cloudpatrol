name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same ref. Without
# this, a push while a run is going wastes a full matrix of runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      # Fails if .env.example contains a real-looking credential. It is a
      # committed file, so a pasted key would be public the moment it is pushed.
      - name: .env.example contains no secrets
        run: pytest -q tests/test_env_example_safety.py

      - name: Pytest
        run: pytest -q

  api-postgres:
    name: API (PostgreSQL integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    # A service container gives the job a PostgreSQL server that is created for
    # this run and destroyed with it. No secret is referenced: the credentials
    # below are throwaway values for a database that only exists inside the
    # runner, and the harness creates and drops its own database on top.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The service container is reachable at localhost from the job, so this
      # needs no non-loopback opt-in. The harness still creates a fresh database
      # named cloudpatrol_it_<random> and drops it at the end.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Proves the integration tests actually ran rather than skipping, which
      # is what would happen if TEST_DATABASE_URL were lost.
      - name: PostgreSQL integration tests
        run: pytest -q tests/integration --no-header -p no:cacheprovider

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The dashboard reads this at runtime; the build only needs it set so
          # the client bundle carries a valid base URL.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
